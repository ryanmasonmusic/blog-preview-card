<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customize in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;

      }
      .attribution a {

      }
    </style>

  <body>
    <div class="card">
      <img 
        src="./assets/images/illustration-article.svg"
        alt="Illustration for HTML & CSS foundations article"

      <h3>Published 21 Dec 2023</h3>

      <p>

        <img
          class="avatar"
          src="./assets/images/image-avatar.webp"
          alt="Greg Hooper profile avatar"
        />

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.

      <a href="https://www.frontendmentor.io/profile/ryanmasonmusic"
